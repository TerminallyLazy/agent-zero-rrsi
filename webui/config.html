<html><head><title>RRSI settings</title></head><body><div x-data><template x-if="config"><div>
<div class="section-title">Regularized self-improvement</div>
<div class="section-description">Starting defaults: 20 rounds, 2 candidates, 2 trials per task and 3 unchanged baseline evaluations. These are not experimentally optimized for Agent Zero.</div>
<div class="field"><div class="field-label"><div class="field-title">Enable RRSI</div><div class="field-description">Complete dependency setup and image selection first. The controller checks compatibility before paid work.</div></div><div class="field-control"><input type="checkbox" x-model="config.enabled"></div></div>
<div class="field"><div class="field-label"><div class="field-title">Daily spending cap (USD)</div><div class="field-description">0 means unlimited. Positive caps require prices for every used model role.</div></div><div class="field-control"><input type="number" min="0" step="0.01" x-model.number="config.daily_budget_usd"></div></div>
<div class="field"><div class="field-label"><div class="field-title">Evaluation Docker image</div><div class="field-description">A local Agent Zero framework image. Each campaign freezes its immutable image identity.</div></div><div class="field-control"><input type="text" x-model="config.framework_image"></div></div>
<template x-for="option in [{key:'automatic_capture',name:'Capture eligible future interactions'},{key:'automatic_campaigns',name:'Check hourly for idle campaigns'},{key:'automatic_activation',name:'Activate validated final incumbent for new conversations'}]" :key="option.key"><div class="field"><div class="field-label"><div class="field-title" x-text="option.name"></div></div><div class="field-control"><input type="checkbox" x-model="config[option.key]"></div></div></template>
<template x-for="option in [{key:'rounds',name:'Rounds',min:1},{key:'candidates',name:'Candidates per round',min:1},{key:'trials_per_task',name:'Trials per task',min:2},{key:'baseline_evaluations',name:'Baseline evaluations',min:3}]" :key="option.key"><div class="field"><div class="field-label"><div class="field-title" x-text="option.name"></div></div><div class="field-control"><input type="number" :min="option.min" x-model.number="config[option.key]"></div></div></template>
<div class="field"><div class="field-label"><div class="field-title">Model pricing</div><div class="field-description">USD per million tokens. Prices apply to the configured Agent Zero models; no credentials are stored here.</div></div></div>
<template x-for="role in ['policy','utility','vision','proposer','analyst','critic','digester','embedding']" :key="role"><div class="field"><div class="field-label"><div class="field-title" x-text="role"></div></div><div class="field-control"><button class="button" x-show="!config.pricing[role]" @click="config.pricing[role] = {input_per_million:null,output_per_million:null}">Set prices</button><template x-if="config.pricing[role]"><div><label>Input <input type="number" min="0" step="0.001" x-model.number="config.pricing[role].input_per_million"></label><label>Output <input type="number" min="0" step="0.001" x-model.number="config.pricing[role].output_per_million"></label><button class="button" @click="delete config.pricing[role]">Clear</button></div></template></div></div></template>
<div class="field"><div class="field-label"><div class="field-title">Campaign dashboard</div><div class="field-description">Native activation executes generated Python with Agent Zero's normal permissions. Disposable Docker environments isolate evaluation.</div></div><div class="field-control"><button class="button" @click="openModal('/plugins/rrsi/webui/main.html')">Open dashboard</button></div></div>
</div></template></div></body></html>
